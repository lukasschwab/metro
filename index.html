<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paris Métro — Origins of Every Station Name</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Paris Métro</h1>
    <p class="subtitle">The origin of every station name · <a id="view-toggle" href="?view=table">Table</a></p>
  </header>

  <div id="controls">
    <div id="line-filter"></div>
    <div id="category-filter"></div>
    <div id="timeline">
      <button id="play-btn" aria-label="Play timeline">&#9654;</button>
      <input id="year-slider" type="range" min="1900" max="2026" value="2026">
      <span id="year-label">2026</span>
      <span id="station-count"></span>
    </div>
    <div id="search-box">
      <input id="search" type="text" placeholder="Search stations…" autocomplete="off">
      <div id="search-results"></div>
    </div>
  </div>

  <main>
    <div id="map-container">
      <svg id="metro-map"></svg>
    </div>
    <div id="table-container" class="hidden">
      <table id="station-table">
        <thead>
          <tr>
            <th></th><th data-sort="name" data-label="Name">Name</th><th data-sort="lines" data-label="Lines">Lines</th><th data-sort="opened" data-label="Opened">Opened</th><th class="arr-col">Location</th><th>Category</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <aside id="sidebar">
      <button id="sidebar-toggle" aria-label="Toggle drawer">[&minus;]</button>
      <button id="sidebar-close" aria-label="Close" class="hidden">&times;</button>
      <div id="sidebar-content"></div>
    </aside>
  </main>

  <ninja-keys></ninja-keys>
  <script type="module" src="/app.js"></script>
</body>
</html>
